name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Pruebas unitarias de Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compilar y ejecutar las pruebas unitarias
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
